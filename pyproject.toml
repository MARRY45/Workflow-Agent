[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "workflow-agent"
version = "0.1.0"
description = "Prototype agent architecture that automates multi-step technical research and code verification tasks."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["llm", "agent", "tool-calling", "asyncio", "litellm", "code-verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "litellm>=1.70,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.27,<1",
    # The verification tools run pytest inside the sandboxed subprocess.
    "pytest>=8",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
workflow-agent = "workflow_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_agent"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "pyproject.toml"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "ASYNC",    # async pitfalls
    "PT",       # pytest style
    "RET",      # return consistency
    "PIE",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
# LiteLLM is huge and only partially typed; treat it as Any at the boundary.
module = ["litellm", "litellm.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "live: talks to a real LLM provider (needs WORKFLOW_AGENT_LIVE_MODEL and provider API key)",
]
filterwarnings = [
    # Emitted by LiteLLM's own pydantic models on import; not actionable for us.
    "ignore:.*ReadOnly.*:UserWarning",
]

[tool.coverage.run]
source = ["workflow_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
